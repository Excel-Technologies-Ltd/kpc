services:
  ollama:
    image: ollama/ollama:0.33.3
    environment:
      - OLLAMA_ORIGINS="*"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "11434:11434"
    volumes:
      - "ollama:/root/.ollama"
    restart: always
    
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage:z

volumes:
  qdrant_storage:
  ollama:
